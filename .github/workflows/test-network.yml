
name: Test nettverksmodul

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: modules/network

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Kontroller formatering
        run: terraform fmt -check -recursive

      - name: Initialiser Terraform
        run: terraform init -backend=false

      - name: Valider Terraform
        run: terraform validate

      - name: Installer TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialiser TFLint
        run: tflint --init

      - name: Kjor TFLint
        run: tflint

      - name: Installer Checkov
        run: python -m pip install checkov

      - name: Kjor Checkov
        run: checkov --config-file .checkov.yaml

      - name: Kjor Terraform-tester
        run: terraform test
